<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App del Clima con React</title>
    
    <!-- 1. Scripts de React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 2. Script de Babel para convertir JSX (URL CORREGIDA) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 3. Tailwind CSS para estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 4. Google Fonts para una mejor tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to top, #6a85b6, #bac8e0);
        }
        /* Clase para el efecto de "vidrio esmerilado" */
        .glassmorphism {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* Animación de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente de la tarjeta del clima
        function WeatherCard({ data }) {
            if (!data) return null;

            // URL del icono del clima
            const iconUrl = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
            const description = data.weather[0].description.charAt(0).toUpperCase() + data.weather[0].description.slice(1);

            return (
                <div className="glassmorphism w-full max-w-md p-6 sm:p-8 rounded-2xl shadow-lg text-white fade-in">
                    <div className="text-center">
                        <h2 className="text-3xl sm:text-4xl font-bold">{data.name}, {data.sys.country}</h2>
                        <p className="text-lg mt-1">{description}</p>
                    </div>
                    <div className="flex items-center justify-center my-6">
                        <img src={iconUrl} alt={description} className="w-24 h-24 sm:w-32 sm:h-32 -my-4" />
                        <p className="text-6xl sm:text-7xl font-bold ml-4">{Math.round(data.main.temp)}°C</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4 text-center text-sm sm:text-base">
                        <div className="glassmorphism p-3 rounded-xl">
                            <p className="font-semibold">Sensación Térmica</p>
                            <p>{Math.round(data.main.feels_like)}°C</p>
                        </div>
                        <div className="glassmorphism p-3 rounded-xl">
                            <p className="font-semibold">Humedad</p>
                            <p>{data.main.humidity}%</p>
                        </div>
                        <div className="glassmorphism p-3 rounded-xl">
                            <p className="font-semibold">Viento</p>
                            <p>{(data.wind.speed * 3.6).toFixed(1)} km/h</p>
                        </div>
                        <div className="glassmorphism p-3 rounded-xl">
                            <p className="font-semibold">Presión</p>
                            <p>{data.main.pressure} hPa</p>
                        </div>
                    </div>
                </div>
            );
        }

        // Componente principal de la aplicación
        function App() {

            const API_KEY = '7520642cda54343d2efbee6c0451ee15'; 
            // =================================================================

            const [city, setCity] = useState('');
            const [weatherData, setWeatherData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [welcome, setWelcome] = useState(true);

            const fetchWeather = async (cityName) => {
                if (!API_KEY) {
                    setError('¡No olvides agregar tu clave de API!');
                    return;
                }
                
                setLoading(true);
                setError(null);
                setWeatherData(null);
                setWelcome(false);

                const API_URL = `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=${API_KEY}&units=metric&lang=es`;

                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) {
                        // Añadimos una comprobación específica para el error de API Key (código 401)
                        if (response.status === 401) {
                            throw new Error('Clave de API no válida o inactiva. Revisa tu clave en OpenWeatherMap.');
                        } else if (response.status === 404) {
                            throw new Error('Ciudad no encontrada. ¡Intenta de nuevo!');
                        } else {
                            throw new Error('Algo salió mal. Por favor, intenta más tarde.');
                        }
                    }
                    const data = await response.json();
                    setWeatherData(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (city.trim()) {
                    fetchWeather(city);
                }
            };

            return (
                <div className="min-h-screen w-full flex flex-col items-center justify-center p-4">
                    <div className="w-full max-w-md">
                        <form onSubmit={handleSubmit} className="flex w-full mb-6 shadow-lg">
                            <input
                                type="text"
                                value={city}
                                onChange={(e) => setCity(e.target.value)}
                                placeholder="Escribe una ciudad..."
                                className="w-full p-4 rounded-l-xl border-0 outline-none text-gray-800 text-lg"
                                disabled={!API_KEY}
                            />
                            <button
                                type="submit"
                                className="bg-blue-600 text-white p-4 rounded-r-xl hover:bg-blue-700 transition-colors disabled:bg-gray-400"
                                disabled={!API_KEY || loading}
                            >
                                {loading ? '...' : 'Buscar'}
                            </button>
                        </form>

                        {welcome && <p className="text-center text-white text-lg">Escribe el nombre de una ciudad para ver el clima.</p>}
                        {error && <p className="text-center text-red-300 bg-red-900 bg-opacity-50 p-3 rounded-xl">{error}</p>}
                        <WeatherCard data={weatherData} />
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
